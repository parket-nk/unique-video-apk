name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Complete App Project
      run: |
        mkdir -p app/src/main/java/com/uniqueizer/video
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "VideoUniqueizer"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.uniqueizer.video'
            compileSdk 34

            defaultConfig {
                applicationId "com.uniqueizer.video"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"

                ndk {
                    abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
                }
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
                debug {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'com.arthenica:ffmpeg-kit-min-gpl:5.1'
        }
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Уникализатор Видео</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.VideoUniqueizer" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">#6366F1</item>
                <item name="colorPrimaryVariant">#4F46E5</item>
                <item name="colorOnPrimary">#FFFFFF</item>
                <item name="android:statusBarColor">#0F172A</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="@string/app_name"
                android:roundIcon="@android:drawable/sym_def_app_icon"
                android:supportsRtl="true"
                android:theme="@style/Theme.VideoUniqueizer">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#0F172A"
            android:fillViewport="true">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:padding="20dp">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_gravity="center_horizontal"
                    android:layout_marginTop="16dp"
                    android:text="Уникализатор Видео"
                    android:textColor="#A5B4FC"
                    android:textSize="24sp"
                    android:textStyle="bold" />

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_gravity="center_horizontal"
                    android:layout_marginTop="4dp"
                    android:text="Актуализация для Reels, TikTok, Shorts"
                    android:textColor="#94A3B8"
                    android:textSize="13sp" />

                <com.google.android.material.card.MaterialCardView
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="20dp"
                    app:cardBackgroundColor="#1E293B"
                    app:cardCornerRadius="14dp"
                    app:strokeColor="#334155"
                    app:strokeWidth="1dp">

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical"
                        android:padding="16dp">

                        <TextView
                            android:layout_width="wrap_content"
                            android:layout_height="wrap_content"
                            android:text="Параметры уникализации:"
                            android:textColor="#FFFFFF"
                            android:textSize="15sp"
                            android:textStyle="bold" />

                        <TextView
                            android:layout_width="wrap_content"
                            android:layout_height="wrap_content"
                            android:layout_marginTop="8dp"
                            android:text="⚡ Ускорение: 1.1x\n🌊 Зум: +7% с медленным плаванием\n🎨 Свет: мягкая рандомизация оттенков\n🎧 Звук: смена частотного отпечатка\n🛡 Метаданные: полное удаление и новый хэш"
                            android:textColor="#CBD5E1"
                            android:textSize="13sp"
                            android:lineSpacingExtra="4dp" />
                    </LinearLayout>
                </com.google.android.material.card.MaterialCardView>

                <Button
                    android:id="@+id/btnPickVideo"
                    android:layout_width="match_parent"
                    android:layout_height="56dp"
                    android:layout_marginTop="24dp"
                    android:backgroundTint="#4F46E5"
                    android:text="📁 Выбрать видео из галереи"
                    android:textAllCaps="false"
                    android:textColor="#FFFFFF"
                    android:textSize="16sp"
                    app:cornerRadius="12dp" />

                <TextView
                    android:id="@+id/tvSelectedFile"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="10dp"
                    android:text="Видео не выбрано"
                    android:textAlignment="center"
                    android:textColor="#94A3B8"
                    android:textSize="13sp" />

                <Button
                    android:id="@+id/btnProcess"
                    android:layout_width="match_parent"
                    android:layout_height="56dp"
                    android:layout_marginTop="20dp"
                    android:backgroundTint="#10B981"
                    android:enabled="false"
                    android:text="✨ Сделать уникальным"
                    android:textAllCaps="false"
                    android:textColor="#FFFFFF"
                    android:textSize="16sp"
                    android:textStyle="bold"
                    app:cornerRadius="12dp" />

                <ProgressBar
                    android:id="@+id/progressBar"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_gravity="center_horizontal"
                    android:layout_marginTop="20dp"
                    android:indeterminateTint="#6366F1"
                    android:visibility="gone" />

                <TextView
                    android:id="@+id/tvStatus"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="12dp"
                    android:textAlignment="center"
                    android:textColor="#F8FAFC"
                    android:textSize="14sp" />

            </LinearLayout>
        </ScrollView>
        EOF

        cat << 'EOF' > app/src/main/java/com/uniqueizer/video/MainActivity.kt
        package com.uniqueizer.video

        import android.content.ContentValues
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.MediaStore
        import android.view.View
        import android.widget.Button
        import android.widget.ProgressBar
        import android.widget.TextView
        import android.widget.Toast
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import com.arthenica.ffmpegkit.FFmpegKit
        import com.arthenica.ffmpegkit.ReturnCode
        import java.io.File
        import java.io.FileOutputStream
        import java.util.UUID
        import kotlin.math.PI
        import kotlin.random.Random

        class MainActivity : AppCompatActivity() {

            private lateinit var btnPickVideo: Button
            private lateinit var btnProcess: Button
            private lateinit var tvSelectedFile: TextView
            private lateinit var tvStatus: TextView
            private lateinit var progressBar: ProgressBar

            private var selectedVideoUri: Uri? = null

            private val pickVideoLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                if (uri != null) {
                    selectedVideoUri = uri
                    tvSelectedFile.text = "Видео выбрано (нажмите «Сделать уникальным»)"
                    btnProcess.isEnabled = true
                    tvStatus.text = ""
                }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                btnPickVideo = findViewById(R.id.btnPickVideo)
                btnProcess = findViewById(R.id.btnProcess)
                tvSelectedFile = findViewById(R.id.tvSelectedFile)
                tvStatus = findViewById(R.id.tvStatus)
                progressBar = findViewById(R.id.progressBar)

                btnPickVideo.setOnClickListener {
                    pickVideoLauncher.launch("video/*")
                }

                btnProcess.setOnClickListener {
                    selectedVideoUri?.let { uri ->
                        startVideoProcessing(uri)
                    }
                }
            }

            private fun startVideoProcessing(uri: Uri) {
                btnPickVideo.isEnabled = false
                btnProcess.isEnabled = false
                progressBar.visibility = View.VISIBLE
                tvStatus.text = "Копирование видео во временный буфер..."

                Thread {
                    try {
                        val inputFile = File(cacheDir, "input_${System.currentTimeMillis()}.mp4")
                        contentResolver.openInputStream(uri)?.use { input ->
                            FileOutputStream(inputFile).use { output ->
                                input.copyTo(output)
                            }
                        }

                        val outputFile = File(cacheDir, "unique_${System.currentTimeMillis()}.mp4")

                        val speed = 1.09 + Random.nextDouble(0.0, 0.03)
                        val zoom = 1.07 + Random.nextDouble(0.0, 0.008)
                        val periodX = 7.5 + Random.nextDouble(0.0, 3.5)
                        val periodY = 9.0 + Random.nextDouble(0.0, 4.0)
                        val phaseX = Random.nextDouble(0.0, 2 * PI)
                        val phaseY = Random.nextDouble(0.0, 2 * PI)
                        val amp = 0.82

                        val brightness = Random.nextDouble(-0.02, 0.02)
                        val contrast = 1.02 + Random.nextDouble(0.0, 0.03)
                        val saturation = 1.03 + Random.nextDouble(0.0, 0.03)
                        val gamma = 0.99 + Random.nextDouble(0.0, 0.03)

                        val eqFreq = Random.nextInt(900, 3000)
                        val eqGain = Random.nextDouble(-1.5, 1.5)
                        val pitchDrift = 1.0 + Random.nextDouble(-0.003, 0.003)
                        val shiftedRate = (44100 * pitchDrift).toInt()

                        val xExpr = "(in_w-out_w)/2+((in_w-out_w)/2)*$amp*sin(2*PI*t/$periodX+$phaseX)"
                        val yExpr = "(in_h-out_h)/2+((in_h-out_h)/2)*$amp*cos(2*PI*t/$periodY+$phaseY)"

                        val vf = "setpts=PTS/$speed," +
                                "crop=w='trunc(in_w/$zoom/2)*2':h='trunc(in_h/$zoom/2)*2':x='$xExpr':y='$yExpr'," +
                                "scale=in_w:in_h:flags=lanczos," +
                                "eq=brightness=$brightness:contrast=$contrast:saturation=$saturation:gamma=$gamma"

                        val af = "asetrate=$shiftedRate,aresample=44100,equalizer=f=$eqFreq:t=q:w=1.2:g=$eqGain,atempo=$speed"
                        val uniqueTag = UUID.randomUUID().toString().substring(0, 8)

                        val ffmpegCommand = arrayOf(
                            "-y",
                            "-i", inputFile.absolutePath,
                            "-vf", vf,
                            "-af", af,
                            "-c:v", "libx264",
                            "-preset", "fast",
                            "-crf", "21",
                            "-pix_fmt", "yuv420p",
                            "-c:a", "aac",
                            "-b:a", "192k",
                            "-map_metadata", "-1",
                            "-metadata", "title=video_$uniqueTag",
                            outputFile.absolutePath
                        ).joinToString(" ") { "\"$it\"" }

                        runOnUiThread {
                            tvStatus.text = "Идет уникализация через FFmpeg...\n(пожалуйста, подождите)"
                        }

                        FFmpegKit.executeAsync(ffmpegCommand) { session ->
                            val returnCode = session.returnCode
                            runOnUiThread {
                                progressBar.visibility = View.GONE
                                btnPickVideo.isEnabled = true
                                btnProcess.isEnabled = true

                                if (ReturnCode.isSuccess(returnCode)) {
                                    saveVideoToGallery(outputFile)
                                    tvStatus.text = "Готово! Уникальное видео сохранено в вашу Галерею."
                                    Toast.makeText(this, "Видео успешно сохранено в Галерею!", Toast.LENGTH_LONG).show()
                                } else {
                                    tvStatus.text = "Ошибка при обработке видео: ${session.failStackTrace}"
                                    Toast.makeText(this, "Ошибка обработки FFmpeg", Toast.LENGTH_SHORT).show()
                                }
                                inputFile.delete()
                            }
                        }

                    } catch (e: Exception) {
                        runOnUiThread {
                            progressBar.visibility = View.GONE
                            btnPickVideo.isEnabled = true
                            btnProcess.isEnabled = true
                            tvStatus.text = "Ошибка: ${e.localizedMessage}"
                        }
                    }
                }.start()
            }

            private fun saveVideoToGallery(videoFile: File) {
                val fileName = "Unique_${System.currentTimeMillis()}.mp4"
                val values = ContentValues().apply {
                    put(MediaStore.Video.Media.DISPLAY_NAME, fileName)
                    put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                        put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/UniqueVideos")
                    }
                }

                val uri = contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values)
                uri?.let { destUri ->
                    contentResolver.openOutputStream(destUri)?.use { out ->
                        videoFile.inputStream().use { input ->
                            input.copyTo(out)
                        }
                    }
                }
            }
        }
        EOF

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VideoUniqueizer-APK
        path: app/build/outputs/apk/debug/*.apk
